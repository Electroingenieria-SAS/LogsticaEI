<!doctype html>
<html lang="es">
<head>
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061B46">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EI Logística">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Electroingeniería · Trazabilidad Logística</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/app-icon.svg">
  <link rel="preload" href="./assets/logo-electroingenieria.jpeg" as="image">
  <link rel="stylesheet" href="./styles.css?v=v245-firestore-autodetect-y-version-global">
  <link rel="stylesheet" href="./mobile-v221.css?v=v245-firestore-autodetect-y-version-global">


  <script>
    (function(){
      var expectedVersion="v245-firestore-autodetect-y-version-global";
      window.EI_REQUIRED_VERSION=expectedVersion;

      try{
        localStorage.setItem("EI_REQUIRED_VERSION",expectedVersion);
      }catch(e){}

      window.__EI_CLEAN_PROMISE=(function(){
        var tasks=[];

        if("serviceWorker" in navigator){
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function(registrations){
              return Promise.all(registrations.map(function(registration){
                try{return registration.unregister();}catch(e){return false;}
              }));
            })
          );
        }

        if(window.caches){
          tasks.push(
            caches.keys().then(function(keys){
              return Promise.all(keys.map(function(key){
                return caches.delete(key);
              }));
            })
          );
        }

        try{
          sessionStorage.removeItem("ei_v242_firestore_recovery");
          sessionStorage.removeItem("ei_v245_firestore_recovery");
          localStorage.setItem("EI_REQUIRED_VERSION",expectedVersion);
        }catch(e){}

        console.info("[EI] index.html cargado:",expectedVersion);
        return Promise.all(tasks).catch(function(cleanError){
          console.warn("[EI] La limpieza preventiva de caché no pudo completarse.",cleanError);
        });
      })();
    })();
  </script>

</head>
<body>
  <div id="app" class="app-shell">
    <main class="boot-screen">
      <section class="boot-card">
        <img src="./assets/logo-electroingenieria.jpeg" alt="Electroingeniería">
        <strong>Cargando trazabilidad integrada</strong>
        <span>Inicializando flujo documental, evidencias, corte y VSM</span>
      </section>
    </main>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script defer data-ei-pdf-lib="true" src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script defer src="https://accounts.google.com/gsi/client"></script>
  <script defer src="./firebase-config.js?v=unificado-firebase-principal-v50-pdf-universal-cortes-m"></script>


  <script>
    window.addEventListener("load",function(){
      var expectedVersion=
        window.EI_REQUIRED_VERSION||
        "v245-firestore-autodetect-y-version-global";

      Promise.resolve(window.__EI_CLEAN_PROMISE).finally(function(){
        var existing=document.querySelectorAll('script[data-ei-main-app="true"]');
        existing.forEach(function(node){
          if(node&&node.parentNode)node.parentNode.removeChild(node);
        });

        var script=document.createElement("script");
        script.setAttribute("data-ei-main-app","true");
        script.src="./app.js?v="+encodeURIComponent(expectedVersion)+"&t="+Date.now();
        script.async=false;

        script.onload=function(){
          setTimeout(function(){
            var loadedVersion=window.EI_BUILD_LOADED||"";

            if(loadedVersion!==expectedVersion){
              console.error(
                "[EI] Incompatibilidad de versión. Index:",
                expectedVersion,
                "App:",
                loadedVersion||"sin identificar"
              );

              var url=new URL(window.location.href);
              url.searchParams.set("force_build",expectedVersion);
              url.searchParams.set("t",String(Date.now()));
              window.location.replace(url.toString());
              return;
            }

            console.info("[EI] versión confirmada:",expectedVersion);
          },100);
        };

        script.onerror=function(){
          var target=document.getElementById("app");
          if(target){
            target.innerHTML=
              '<main class="boot-screen"><section class="boot-card">'+
              '<strong>No fue posible cargar app.js</strong>'+
              '<span>Abra reset-cache.html y vuelva a intentar.</span>'+
              '</section></main>';
          }
        };

        document.body.appendChild(script);
      });
    });
  </script>

</body>
</html>
