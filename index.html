<!doctype html>
<html lang="es">
<head>
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061B46">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EI Logística">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Electroingeniería · Trazabilidad Logística</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/app-icon.svg">
  <link rel="preload" href="./assets/logo-electroingenieria.jpeg" as="image">
  <link rel="stylesheet" href="./styles.css?v=v181-mobile-corte-real-anticache">

  <script>
    (function(){
      var V="v181-mobile-corte-real-anticache";
      try{
        var key="EI_LOGISTICA_HARD_VERSION";
        var old=localStorage.getItem(key);
        if(old!==V){
          localStorage.setItem(key,V);
          sessionStorage.setItem("EI_SKIP_BOOT_ONCE",V);
          var done=function(){ location.replace(location.pathname+"?v="+V+"&t="+Date.now()); };
          var tasks=[];
          if("serviceWorker" in navigator){
            tasks.push(navigator.serviceWorker.getRegistrations().then(function(regs){return Promise.all(regs.map(function(r){return r.unregister();}));}));
          }
          if(window.caches){
            tasks.push(caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k);}));}));
          }
          Promise.all(tasks).then(done).catch(done);
        }
      }catch(e){}
    })();
  </script>

</head>
<body>
  <div id="app" class="app-shell">
    <main class="boot-screen">
      <section class="boot-card">
        <img src="./assets/logo-electroingenieria.jpeg" alt="Electroingeniería">
        <strong>Cargando trazabilidad integrada</strong>
        <span>Inicializando flujo documental, evidencias, corte y VSM</span>
      </section>
    </main>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script defer data-ei-pdf-lib="true" src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script defer src="https://accounts.google.com/gsi/client"></script>
  <script defer src="./firebase-config.js?v=unificado-firebase-principal-v50-pdf-universal-cortes-m"></script>
  <script defer src="./app-v181.js?v=v181-mobile-corte-real-anticache"></script>
  <script>
    window.addEventListener("load", function () {
      if (!("serviceWorker" in navigator)) return;
      navigator.serviceWorker.register("./service-worker.js?v=v181-mobile-corte-real-anticache", { scope: "./" }).then(function(reg){
        reg.update();
        if (reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
        if (reg.active) reg.active.postMessage({type:"CLEAR_CACHE"});
      }).catch(function(){});
      var refreshed = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (refreshed) return;
        refreshed = true;
        location.reload();
      });
    });
  </script>
</body>
</html>
